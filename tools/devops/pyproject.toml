[project]
name = "devops"
version = "0.1.0"
description = "Host-side devops CLI: runs the vulkan-stack-adapter Zig toolchain container with timestamped, logged output."
requires-python = ">=3.13"
# Runtime uses the standard library only. The host needs nothing but uv.
dependencies = []

[project.scripts]
devops = "devops.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
