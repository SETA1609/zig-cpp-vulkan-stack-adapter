name: Rebase branches

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  rebase:
    name: Rebase feature/* onto ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase branches
        run: bash scripts/ci/rebase-branches.sh ${{ github.ref_name }}
