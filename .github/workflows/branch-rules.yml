name: Branch Rules

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read

jobs:
  check-source-branch:
    name: Check source/target branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch hierarchy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: python scripts/ci/check_branch_source.py "$BASE_REF" "$HEAD_REF"
