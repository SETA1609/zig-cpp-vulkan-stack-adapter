name: Branch Rules

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read

jobs:
  check-source-branch:
    name: Check source/target branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch hierarchy
        run: bash scripts/ci/check-branch-source.sh "${{ github.base_ref }}" "${{ github.head_ref }}"
